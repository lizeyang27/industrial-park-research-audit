name: public-skill-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install release-validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v
      - name: Check public release boundary
        run: python scripts/preflight_public.py .
      - name: Check public storage budget
        run: >-
          python scripts/audit_storage_budget.py .
          --profile public-skill
          --soft-budget-bytes 5000000
          --hard-budget-bytes 10000000
