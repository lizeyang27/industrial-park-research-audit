  default_prompt: "Use $industry-research-audit in its default public full-evidence mode. Before judging the draft, apply the public industrial-park question priors and build a framework-first reading plan. Reconstruct the decision-oriented thesis, preserve every qualifying issue in a complete technical ledger, browse authoritative primary sources to verify material current claims and counterevidence, then provide the concise Chinese reader report plus zero to two evidence-bounded new viewpoints. Record the loaded-resource hashes and actual web trace, and validate the review bundle before delivery."
